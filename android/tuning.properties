# SPDX-License-Identifier: AGPL-3.0-or-later
# canto-tts Android 引擎 · 调参
# 用法:推到 <模型目录>/tuning.properties,重启引擎生效

# ── 优化级别 ──
# all | extended | basic | none   默认 all
# ⚠️ 实测:basic+arena=0 ⇒ Anon 1055MB;all+arena=1 ⇒ Anon 916MB(【默认最省】)
optLevel=all
arena=1
memPattern=1

# ── 线程(0 = 后端默认;Android 上 2 最优)──
threads=0

# ── 单次合成帧数上限 ──
# 1 帧 = 80ms 音频。
# 🎯 2026-09-25 精确定位后的假设:
#    实测合成期间 CPU 在 t≈6s 时被 ColorOS 冻住(CPU 时间停止增长)
#    ⇒ 【若单次合成窗口 < 3 秒,可能在 freeze 前完成】
#    ⇒ 理论:prefill 0.5s + N 帧 × 63ms
#         N=40 ⇒ 3.0s(边界)  N=20 ⇒ 1.8s  N=10 ⇒ 1.1s
#    ⇒ 【先用 10 试】(0.8s 音频,只能合成很短的话)
#    ⚠️ 代价:长文本必须【分多次调用】合成再拼接
maxFrames=150

# ── 推理守护的端口(仅绑 127.0.0.1)──
# ⚠️ 必须与 install.sh 启动守护时的端口一致(改一处要改两处)
# 🎯 架构(2026-09-25 定案):推理跑在 root 守护里,App 只做毫秒级转发。
#    原因:实测 ColorOS 的 virtualFreeze 会冻死 App 进程内的长时间推理
#    (合成期间 CPU 在 t≈6s 后完全停止;10 种 App 侧对策全部无效),
#    而 uid=0 的守护【不被冻】(实测完整合成 4.5 秒)。

# 🎯 为什么是 150(2026-09-26 实测第三轮修正):
#   ✅ 【关键突破:心跳解决了冻结!】
#      实测:守护每帧发一个心跳字节 ⇒ App 侧连续等 24 秒
#            wchan 仍是 do_epoll_wait(【没被冻】),并成功收到 56 帧整段
#      ⇒ 所以 maxFrames 不再需要为了"防冻"而压低
#      ⇒ 放到 150(12 秒音频)足够一整句(实测 11 字 = 86 帧)
#   ⚠️ 历史(留档):
#      第一版 10 ⇒ 只念 3 字 · 第二版 40 ⇒ 3 字一段(韵律被切碎,用户说"叽里咕噜")
#      根因:maxFrames 是【硬截断】,小了会砍掉没念完的字
#      而当时 App 会被冻,所以不敢放大 —— 心跳解决后这个矛盾就没了
#
# 🎯 第一轮记录(为什么曾经是 25/40):
#   ⚠️ 关键认识:maxFrames 是【硬截断】,不是"请求多少给多少"!
#      实测:7 字请求 ⇒ 输出正好 2.00 秒 = 25 帧 ⇒ 【被砍掉一半】
#   ⇒ 它必须 ≥ 单段的自然帧数,否则就是"只说开头几个字"
#   实测自然帧数:1字=20 · 3字=20 · 6字=56 · 11字=86
#   ⇒ App 侧分段粒度 = 3 字(每段自然 20 帧,合成 ≈4 秒,在冻结窗口内)
#   ⇒ 40 帧 = 3 字的 20 帧 + 100% 余量 ⇒ 单段【不会被截断】
#   ⚠️ 不能靠"调大"解决长句:6 字要 9 秒合成 ⇒ 超过 App 冻结窗口(~6 秒)
#      ⇒ 长句必须靠【App 侧分段】,不是靠守护的长 maxFrames
#   实测帧数 ≈ 20 + 6 × 字数,且【20 帧是最小输出】:
#     「好」1字 → 20 帧(4321ms) · 「今天天」3字 → 20 帧(3837ms)
#     「今天天气很好」6字 → 56 帧(9076ms) · 11 字 → 86 帧(13075ms)
#   ⇒ 25 帧覆盖【3 字以内】(App 侧 ANDROID_GRAIN=3 与它配套)
#   ⚠️ 不能更大:6 字要 9 秒合成,超过 App 的冻结窗口(实测 ~6 秒)
#      ⇒ 大了反而读不到结果(而且会被截断成"只会今天"—— 实测反馈)
#   1 帧 = 80ms 音频;一个粤语音节 ≈ 2.5~4 帧。
#   maxFrames=10 ⇒ 只能念约 3 个字 ⇒ 【用户实际听到"只说一个字"】。
#   25 帧 ≈ 2.0 秒音频 ≈ 6~8 个字,配合 App 侧"每段 ≤ ~6 字"的分段粒度,
#   每段都能【完整】念出来,而单段合成时间 ≈ 1.5~2 秒,仍在冻结窗口内。

# ── 输出采样率(2026-09-26 Nija 指示:砍一半)──
# 48000 = 不降(模型原生) · 24000 = 砍一半(推荐) · 16000 = 宽带语音 · 8000 = 电话质量
#
# ⚠️ 为什么可以降(Nija 原话):
#   「很多音乐平台上那种无损音质和普通MP3音质,我都听不太出来区别」
#   技术上:人声基频 80~300Hz、共振峰到 4~8kHz;
#   电话质量 8kHz 采样就高度可懂,宽带 16kHz 已很清晰,
#   24kHz(12kHz 带宽)比人声需要的【多得多】⇒ 对粤语语音听感几乎无差。
#
# ⚠️⚠️ 但它【不省推理时间、不省内存】—— 模型内部就是 48kHz 生成的,
#   该算的还是算。它只省:① socket 传输量 ② 播放缓冲 ③ 音频文件大小。
#
# ⚠️ 守护侧做的是【先低通滤波再抽取】(FIR 31 抽头),
#   不是"每两个取一个"—— 后者会混叠失真(高频折回,听起来发闷)。
outputSampleRate=24000

# ── ORT Execution Provider(2026-09-27 实测加)──
# cpu(默认) / xnnpack / nnapi / qnn
# ⚠️⚠️ 实测结论:三个非 CPU 的 EP【都没有提速】,xnnpack 反而慢 16%!
#    同一句 33 帧:S7 循环 cpu 1270ms / xnnpack 1478ms / nnapi 1293ms / qnn 1329ms
#    推测原因:自回归每帧只有 16 个小算子 ⇒ EP 的调度与数据搬运开销抵消收益
#    ⇒ 留这个键只为将来换模型/换设备时能快速复测,【默认 cpu】
ep=cpu

# ── 内部静音上限(2026-09-28 加)──
# 模型会在某些粤拼序列后插入很长静音(实测「今日天氣幾好。」= [70,370,220]ms、
# 「你好。」= [570,70]ms),听起来像"两字一顿"。笔记本用同一模型也有 ⇒ 是模型韵律。
# ⇒ 后处理把内部静音压到不超过这个值(毫秒);0 = 不处理。首尾静音不动。
maxPauseMs=180
